[pytest]
# `testpaths = tests` nao e conveniencia: e o que impede o pytest de coletar os dois scripts
# de prova da raiz. `test_sim.py` e `test_auth.py` casam com `test_*.py`, mas sao programas
# que se rodam por `python <arquivo>` -- coleta-los faria o pytest importa-los e executar
# duas provas dentro do proprio processo, fora do isolamento das fixtures. Quem os roda e
# `tests/test_provas_existentes.py`, por subprocesso e de proposito. Os dois tambem guardam
# o corpo atras de `if __name__ == "__main__"`, entao a protecao existe nas duas pontas.
testpaths = tests

markers =
    lento: a prova mais cara da suite -- hoje so `python db.py prova`, que sintetiza 1 ano
        de curva de equity e responde pela maior fatia dos 45 s a 2 min que a suite leva
        (varia muito com a carga da maquina). Roda por PADRAO: correcao antes de velocidade,
        e o comando de pre-deploy tem de cobrir tudo. Quem esta iterando usa
        `python -m pytest -m "not lento"`.

# `-ra` mostra o motivo dos xfail/skip no resumo: um defeito registrado como xfail que fica
# invisivel deixa de ser registro e vira esquecimento.
addopts = -ra
