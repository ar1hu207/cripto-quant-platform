# [LIVE-14] O que o contêiner desliga por cima da unit da conta R, religado.
#
# O dl380 roda o bot num contêiner LXC (imagem do distrobuilder). O gerador do systemd dele,
# /etc/systemd/system-generators/lxc, grava a cada boot e a cada daemon-reload o drop-in
# /run/systemd/system/service.d/zzz-lxc-service.conf, que vale para TODO serviço e diz, entre
# outras coisas, NoNewPrivileges=no, ProtectKernelTunables=no e ProtectControlGroups=no.
# Drop-in vence o arquivo da unit, e os drop-ins são aplicados pela ordem do NOME do arquivo, de
# qualquer diretório. Por isso o NoNewPrivileges=yes que estava na unit da R não valia
# (`systemctl show` dizia "no" e o processo tinha NoNewPrivs 0). Este arquivo ordena depois do
# do contêiner ("zzzz" > "zzz-") e as três passam a valer. Testadas no contêiner, uma por vez.
#
# Não renomeie para algo que ordene antes de zzz-lxc-service.conf (override.conf, que é o nome
# padrão do `systemctl edit`, ordena antes e não vale). Não troque por um zzz-lxc-service.conf
# próprio: com o mesmo nome ele esconderia o do contêiner inteiro, e o que mais o gerador
# puser lá um dia deixaria de valer para a R sem ninguém saber.
#
# Instalar, do checkout de root:
#   sudo install -D -m 644 /opt/cripto-r/app/deploy/cripto-bot-r.service.d/zzzz-depois-do-lxc.conf \
#        /etc/systemd/system/cripto-bot-r.service.d/zzzz-depois-do-lxc.conf
#   sudo systemctl daemon-reload && sudo systemctl restart cripto-bot-r
# Conferir NO PROCESSO, não no arquivo:
#   grep NoNewPrivs /proc/$(systemctl show -p MainPID --value cripto-bot-r)/status     # 1
[Service]
NoNewPrivileges=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
